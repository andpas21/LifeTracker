{% extends "base.html" %}
{% from "partials/_macros.html" import field, page_header %}
{% block title %}Modifica tag{% endblock %}
{% block content %}
{% call page_header("Modifica tag") %}{% endcall %}
<div class="card lt-card lt-narrow"><div class="card-body">
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    {{ field(form.name) }}
    {{ field(form.color) }}
    <button class="btn btn-primary" type="submit">Salva</button>
    <a class="btn btn-link" href="{{ url_for('catalog.tags') }}">Annulla</a>
  </form>
</div></div>
{% endblock %}
