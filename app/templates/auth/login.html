{% extends "base.html" %}
{% from "partials/_macros.html" import field %}
{% block title %}Accedi{% endblock %}
{% block auth_content %}
<form method="post" novalidate>
  {{ form.hidden_tag() }}
  {{ field(form.email, help=None) }}
  {{ field(form.password) }}
  {{ field(form.remember) }}
  <button type="submit" class="btn btn-primary w-100 btn-lg">Accedi</button>
</form>
<p class="text-center small mt-4 mb-0">Non hai un account? <a href="{{ url_for('auth.register') }}">Registrati</a></p>
{% endblock %}
